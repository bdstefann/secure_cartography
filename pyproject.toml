[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "secure-cartography"
version = "2.5.2"
description = "Network Discovery, Topology Mapping, and Vulnerability Assessment"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Scott Peterman", email = "scottpeterman@gmail.com"},
]
keywords = [
    "network",
    "discovery",
    "topology",
    "snmp",
    "ssh",
    "cdp",
    "lldp",
    "cisco",
    "arista",
    "juniper",
    "network-automation",
    "network-mapping",
    "vulnerability",
    "cve",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    # Discovery Engine
    "pysnmp>=7.1",
    "paramiko>=3.0",
    "textfsm>=1.1",

    # Credential Vault
    "cryptography>=42.0",

    # GUI
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",

    # SNMP Proxy Server
    "fastapi>=0.100",
    "uvicorn>=0.27",
    "pydantic>=2.0",

    # Utilities
    "aiofiles>=23.0",
    "PyYAML>=6.0",
    "click>=8.0",
    "requests>=2.30",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
]


[project.urls]
Homepage = "https://github.com/scottpeterman/secure_cartography"
Documentation = "https://github.com/scottpeterman/secure_cartography#readme"
Repository = "https://github.com/scottpeterman/secure_cartography"
Issues = "https://github.com/scottpeterman/secure_cartography/issues"
Changelog = "https://github.com/scottpeterman/secure_cartography/blob/main/RELEASE_NOTES_2_5.md"


[project.scripts]
sc2 = "sc2.ui.__main__:main"
sc2-creds = "sc2.scng.creds.cli:main"
sc2-discover = "sc2.scng.discovery.cli:main"

[project.gui-scripts]
secure-cartography = "sc2.ui.__main__:main"


# ─── Setuptools Configuration ───────────────────────────────────

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "docs", "screenshots"]

[tool.setuptools.package-data]
sc2 = [
    "**/*.html",
    "**/*.css",
    "**/*.js",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.svg",
    "**/*.ico",
    "**/*.gif",
    "**/*.json",
]
"sc2.scng.utils" = [
    "tfsm_templates.db",
]
"sc2.ui" = [
    "*.html",
    "widgets/*.html",
]


# ─── Tool Configuration ─────────────────────────────────────────

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]